name: effx publish

on:
  workflow_run:
    workflows: ["effx analyze"]
    types: [completed]

permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out immutable effx tool revision
        uses: actions/checkout@v4
        with:
          repository: phibkro/oxlint-effect-plugin
          ref: 0e41f6bb73c3e9aba2df75e32ff77da214452497
          path: .effx-tool
          persist-credentials: false
      - name: Download unprivileged analysis artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run download "$RUN_ID" --repo "$GH_REPO" --dir .effx-input
      - name: Select and verify immutable analysis input
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          input="$(find .effx-input -name effx-input.json -type f -print -quit)"
          test -n "$input"
          test "$(find .effx-input -name effx-input.json -type f | wc -l)" -eq 1
          test "$(jq -r '.expectedHeadSha' "$input")" = "$EXPECTED_HEAD_SHA"
          test "$(jq -r '.observedHeadSha' "$input")" = "$EXPECTED_HEAD_SHA"
          cp "$input" .effx-input.json
      - name: Install the reviewed effx tool
        working-directory: .effx-tool
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build
      - name: Produce fail-closed publication plan
        run: .effx-tool/dist/cli.js github plan < .effx-input.json > .effx-plan.json
      - name: Publish canonical Check and review comments
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: bun run .effx-tool/scripts/publish-github-plan.ts .effx-plan.json
